# Builds the plugin when a release is published on GitHub, signs the files
# (artifact attestations) and attaches main.js, manifest.json and styles.css to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx eslint .
      - run: npm test

      - name: Check that the tag matches manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber
